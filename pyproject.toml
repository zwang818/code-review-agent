[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homework-code-review-agent"
version = "1.0.0"
description = "A small read-only Python code-review agent with tool calling and bounded memory"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
code-review-agent = "code_review_agent.cli:main"

[tool.setuptools.packages.find]
include = ["code_review_agent*"]
